<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historical Astronomical Models</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<section class="uts-sky" dir="rtl" aria-label="Historical Astronomical Models">

    <canvas class="uts-stars" aria-hidden="true"></canvas>

    <div class="uts-inner">

        <!-- Persian -->
        <div class="uts-side uts-fa">
            <h2>پژوهشکده تاریخ علم</h2>
            <p>دانشگاه تهران</p>
        </div>

        <!-- Astronomical models -->
        <div class="uts-models" aria-hidden="true">

            <figure>
                <canvas data-model="eudoxus"></canvas>
                <figcaption>
                    <span class="uts-cap-en" lang="en" dir="ltr">
                        Eudoxus · Homocentric spheres
                    </span>
                    <span class="uts-cap-fa">
                        افلاک هم‌مرکز · اودوکسوس
                    </span>
                </figcaption>
            </figure>

            <figure>
                <canvas data-model="ptolemy"></canvas>
                <figcaption>
                    <span class="uts-cap-en" lang="en" dir="ltr">
                        Ptolemy · Eccentric &amp; equant
                    </span>
                    <span class="uts-cap-fa">
                        بطلمیوس · خارج‌مرکز و معدل‌المسیر
                    </span>
                </figcaption>
            </figure>

            <figure>
                <canvas data-model="tusi"></canvas>
                <figcaption>
                    <span class="uts-cap-en" lang="en" dir="ltr">
                        Ṭūsī couple · Maragha
                    </span>
                    <span class="uts-cap-fa">
                        زوج طوسی · مراغه
                    </span>
                </figcaption>
            </figure>

            <figure>
                <canvas data-model="shatir"></canvas>
                <figcaption>
                    <span class="uts-cap-en" lang="en" dir="ltr">
                        Ibn al-Shāṭir · Double epicycle
                    </span>
                    <span class="uts-cap-fa">
                        ابن‌شاطر · دو فلک تدویر
                    </span>
                </figcaption>
            </figure>

        </div>

        <!-- English -->
        <div class="uts-side uts-en" dir="ltr" lang="en">
            <h2>Institute for the History of Science</h2>
            <p>University of Tehran</p>
        </div>

    </div>

</section>

<script src="js/astronomical-models.js"></script>

</body>
</html>
